[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automated-data-analyst"
version = "0.8.0"
description = "The math arm for LLMs: compute and check numbers from CSV and Excel data with pandas, SciPy and statsmodels, each with its calculation, or refused with a reason. Tool definitions, an MCP server and a chat command for Claude, Codex and open-source models (Ollama, vLLM, llama.cpp, LM Studio)."
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sainesh Nakra" }]
keywords = [
    "llm",
    "llm-tools",
    "llm-math",
    "tool-calling",
    "function-calling",
    "ai-agents",
    "agent-tools",
    "agent-skills",
    "claude-skills",
    "claude-code",
    "codex",
    "ollama",
    "lm-studio",
    "open-webui",
    "mcp",
    "mcp-server",
    "model-context-protocol",
    "vllm",
    "llama-cpp",
    "local-llm",
    "open-source-llm",
    "hallucination",
    "fact-checking",
    "claim-verification",
    "data-analysis",
    "ai-data-analyst",
    "statistics",
    "pandas",
    "scipy",
    "statsmodels",
    "csv",
    "excel",
    "tabular-data",
    "exploratory-data-analysis",
    "eda",
    "data-profiling",
    "anomaly-detection",
    "forecasting",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Mathematics",
]

# python-calamine is a core dependency so .xlsx files work out of the box, and
# fast on large sheets. scipy supplies the distributions behind the group
# comparisons, correlation tests and rate tests; statsmodels the
# false-discovery-rate adjustment, the rate interval and the joint model;
# ruptures the change-point search; PyYAML the answers files `ada scan
# --template` writes. docs/credits.md says what each is used for.
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "python-calamine>=0.4,<1",
    "scipy>=1.11,<2",
    "statsmodels>=0.14.2,<1",
    "ruptures>=1.1.10,<2",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
# ADA's tools as LangChain tools, for LangChain agents and LangGraph: ada.tools.langchain().
langchain = ["langchain-core>=0.3,<2"]
# openpyxl writes the workbooks the tests read; langchain-core lets the LangChain tools be tested.
dev = ["ruff>=0.8,<1", "openpyxl>=3.1,<4", "langchain-core>=0.3,<2"]

[project.scripts]
ada = "ada.cli:main"
automated-data-analyst = "ada.cli:main"

[project.urls]
Homepage = "https://github.com/saineshnakra/automated-data-analyst"
Documentation = "https://github.com/saineshnakra/automated-data-analyst/blob/main/docs/README.md"
"LLM tools" = "https://github.com/saineshnakra/automated-data-analyst/blob/main/docs/llm-tools.md"
"ADA Lab" = "https://github.com/saineshnakra/ada-lab"
Source = "https://github.com/saineshnakra/automated-data-analyst"
Issues = "https://github.com/saineshnakra/automated-data-analyst/issues"
Changelog = "https://github.com/saineshnakra/automated-data-analyst/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["ada"]

[tool.setuptools.package-data]
# Read from inside the package at runtime. skills/ada/SKILL.md is what `ada skill` installs.
ada = ["samples/*.csv", "samples/*.md", "skills/ada/SKILL.md", "skills/ada/agents/openai.yaml"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E501"]
