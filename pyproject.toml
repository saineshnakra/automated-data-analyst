[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automated-data-analyst"
version = "0.2.0"
description = "Exploratory analysis for CSV and Excel tables, with the calculation behind every number."
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Sainesh Nakra" }]
keywords = [
    "exploratory-data-analysis",
    "eda",
    "data-profiling",
    "csv",
    "excel",
    "pandas",
    "anomaly-detection",
    "forecasting",
    "tabular-data",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
]

# openpyxl is a core dependency so .xlsx files work out of the box. scipy
# supplies the distributions behind the group comparisons and correlation tests,
# and the rate tests; statsmodels the multiple-testing adjustments, the rate
# interval and the joint model. docs/credits.md says what each is used for.
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "openpyxl>=3.1,<4",
    "scipy>=1.11,<2",
    "statsmodels>=0.14.2,<1",
]

[project.optional-dependencies]
# Only the Streamlit app (app.py, ada/ui.py) needs these.
app = ["streamlit==1.59.2", "plotly>=5.24,<7"]
# Optional AI layer (ada/ai_insights.py). It proposes query plans; pandas runs them.
ai = ["openai>=2.46,<3", "pydantic>=2.11,<3"]
dev = ["ruff>=0.8,<1"]

[project.scripts]
ada = "ada.cli:main"

[project.urls]
Homepage = "https://github.com/saineshnakra/automated-data-analyst"
Demo = "https://automated-data-analyst.streamlit.app/"
Source = "https://github.com/saineshnakra/automated-data-analyst"
Issues = "https://github.com/saineshnakra/automated-data-analyst/issues"

[tool.setuptools]
packages = ["ada"]

[tool.setuptools.package-data]
# Read from inside the package at runtime.
ada = ["assets/*.css", "samples/*.csv", "samples/*.md"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E501"]
"ada/ui.py" = ["E501"]
