[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automated-data-analyst"
version = "0.6.0"
description = "Compute and check numbers from CSV and Excel tables: every number computed by pandas, SciPy and statsmodels with its calculation, claims about the data verified or unverified with a reason, a map of a folder of files, and a paper's tables and figures from research data. A skill for Claude Code and Codex."
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sainesh Nakra" }]
keywords = [
    "data-analysis",
    "fact-checking",
    "claim-verification",
    "ai-data-analyst",
    "research",
    "reproducible-research",
    "reproducibility",
    "research-data",
    "statistics",
    "publication-figures",
    "scientific-figures",
    "methods-section",
    "data-dictionary",
    "provenance",
    "mixed-models",
    "paper",
    "exploratory-data-analysis",
    "eda",
    "data-profiling",
    "csv",
    "excel",
    "pandas",
    "anomaly-detection",
    "forecasting",
    "tabular-data",
    "agent-skills",
    "claude-skills",
    "claude-code",
    "codex",
    "ai-agents",
    "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: Matplotlib",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Visualization",
]

# python-calamine is a core dependency so .xlsx files work out of the box, and
# fast on large sheets. scipy supplies the distributions behind the group
# comparisons, correlation tests and rate tests; statsmodels the
# false-discovery-rate adjustment, the rate interval, the joint model and the
# study analyses; ruptures the change-point search. PyYAML reads study.yml,
# Matplotlib draws the paper figures and python-docx writes the Word tables.
# docs/credits.md says what each is used for.
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "python-calamine>=0.4,<1",
    "scipy>=1.11,<2",
    "statsmodels>=0.14.2,<1",
    "ruptures>=1.1.10,<2",
    "PyYAML>=6,<7",
    "matplotlib>=3.8,<4",
    "python-docx>=1.1,<2",
]

[project.optional-dependencies]
# Only the Streamlit app (app.py, ada/ui.py) needs these.
# starlette<1: Streamlit 1.59 cannot serve images or downloads on Starlette 1.x.
app = ["streamlit==1.59.2", "starlette>=0.40,<1", "plotly>=5.24,<7"]
# Optional AI layer (ada/ai_insights.py). It proposes query plans; pandas runs them.
ai = ["openai>=2.46,<3", "pydantic>=2.11,<3"]
# openpyxl writes the workbooks the tests read.
dev = ["ruff>=0.8,<1", "openpyxl>=3.1,<4"]

[project.scripts]
ada = "ada.cli:main"

[project.urls]
Homepage = "https://github.com/saineshnakra/automated-data-analyst"
Documentation = "https://github.com/saineshnakra/automated-data-analyst/blob/main/docs/research.md"
Demo = "https://automated-data-analyst.streamlit.app/"
Results = "https://github.com/saineshnakra/automated-data-analyst/blob/main/results/README.md"
Source = "https://github.com/saineshnakra/automated-data-analyst"
Issues = "https://github.com/saineshnakra/automated-data-analyst/issues"
Changelog = "https://github.com/saineshnakra/automated-data-analyst/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["ada", "ada.research"]

[tool.setuptools.package-data]
# Read from inside the package at runtime. skills/ada/SKILL.md is what `ada skill` installs.
ada = ["assets/*.css", "samples/*.csv", "samples/*.md", "skills/ada/SKILL.md", "skills/ada/agents/openai.yaml"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E501"]
"ada/ui.py" = ["E501"]
"ada/home.py" = ["E501"]
