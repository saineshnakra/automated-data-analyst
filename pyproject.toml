[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automated-data-analyst"
version = "0.3.0"
description = "A first look at a table of measurements: data checks, group differences, relationships and changes over time, with the calculation behind every number."
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sainesh Nakra" }]
keywords = [
    "exploratory-data-analysis",
    "eda",
    "data-profiling",
    "csv",
    "excel",
    "pandas",
    "anomaly-detection",
    "forecasting",
    "tabular-data",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
]

# openpyxl is a core dependency so .xlsx files work out of the box. scipy
# supplies the distributions behind the group comparisons and correlation tests,
# and the rate tests; statsmodels the false-discovery-rate adjustment, the rate
# interval, the joint model and the study analyses; ruptures the change-point
# search. PyYAML reads study.yml, Matplotlib draws the paper figures and
# python-docx writes the Word tables. docs/credits.md says what each is used for.
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "openpyxl>=3.1,<4",
    "scipy>=1.11,<2",
    "statsmodels>=0.14.2,<1",
    "ruptures>=1.1.10,<2",
    "PyYAML>=6,<7",
    "matplotlib>=3.8,<4",
    "python-docx>=1.1,<2",
]

[project.optional-dependencies]
# Only the Streamlit app (app.py, ada/ui.py) needs these.
app = ["streamlit==1.59.2", "plotly>=5.24,<7"]
# Optional AI layer (ada/ai_insights.py). It proposes query plans; pandas runs them.
ai = ["openai>=2.46,<3", "pydantic>=2.11,<3"]
dev = ["ruff>=0.8,<1"]

[project.scripts]
ada = "ada.cli:main"

[project.urls]
Homepage = "https://github.com/saineshnakra/automated-data-analyst"
Demo = "https://automated-data-analyst.streamlit.app/"
Source = "https://github.com/saineshnakra/automated-data-analyst"
Issues = "https://github.com/saineshnakra/automated-data-analyst/issues"

[tool.setuptools]
packages = ["ada", "ada.research"]

[tool.setuptools.package-data]
# Read from inside the package at runtime.
ada = ["assets/*.css", "samples/*.csv", "samples/*.md"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E501"]
"ada/ui.py" = ["E501"]
