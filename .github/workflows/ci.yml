name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Compile
        run: python -m compileall -q app.py ada tools tests
      - name: Import the app
        run: python -c "import app"

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel
        run: |
          python -m pip install build
          python -m build --wheel
      - name: Install it without the app extras
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
      - name: Run the installed command
        working-directory: /tmp
        run: |
          /tmp/venv/bin/ada --version
          /tmp/venv/bin/ada analyze - > /dev/null
          /tmp/venv/bin/python -c "import ada, sys; ada.analyze(ada.sample()); assert 'streamlit' not in sys.modules"
