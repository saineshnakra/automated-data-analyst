name: Benchmark MATH

# MATH-500 with a small local model, with and without ADA (benchmarks/math500.py), on GitHub's runners. Run
# it by hand from the Actions tab. Each model, condition and shard is its own job, so they run side by side;
# the last job puts the shards together and prints the summary, and every shard's results are an artifact.

on:
  workflow_dispatch:
    inputs:
      subjects:
        description: "MATH subjects, separated by commas"
        default: "Algebra,Intermediate Algebra"
      problems:
        description: "How many problems of those subjects, from the start (empty for all)"
        default: ""
      conditions:
        description: "Conditions, as a JSON list (none, tool, check, prompt, schema)"
        default: '["none", "tool", "check", "prompt", "schema"]'

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        model: ["qwen3:1.7b", "qwen2.5:1.5b"]
        condition: ${{ fromJSON(github.event.inputs.conditions || '["none", "tool", "check", "prompt", "schema"]') }}
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ADA and the grader
        run: python -m pip install -e . "math-verify[antlr4_13_2]==0.9.0"
      - name: Download MATH-500 and check it
        run: |
          curl -fsSL -o math500.jsonl https://huggingface.co/datasets/HuggingFaceH4/MATH-500/resolve/main/test.jsonl
          echo "35dc41080a3680858b27fa7e0533d2d547825316fc5dafe5d316f4ccc5a06132  math500.jsonl" | sha256sum -c
      - name: Install Ollama and the model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > ollama.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:11434/api/tags > /dev/null && break; sleep 2; done
          ollama pull "${{ matrix.model }}"
          ollama --version
      - name: Name the results
        id: name
        run: echo "slug=$(echo '${{ matrix.model }}' | tr ':.' '--')" >> "$GITHUB_OUTPUT"
      - name: Run the benchmark
        env:
          SUBJECTS: ${{ github.event.inputs.subjects || 'Algebra,Intermediate Algebra' }}
          PROBLEMS: ${{ github.event.inputs.problems }}
        run: |
          IFS=',' read -ra subjects <<< "$SUBJECTS"
          python benchmarks/math500.py math500.jsonl --model "${{ matrix.model }}" \
            --condition "${{ matrix.condition }}" --shard "${{ matrix.shard }}/4" --subjects "${subjects[@]}" \
            ${PROBLEMS:+--problems "$PROBLEMS"} --out results.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: math-${{ steps.name.outputs.slug }}-${{ matrix.condition }}-${{ matrix.shard }}
          path: results.jsonl

  summary:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ADA
        run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: math-*
          path: results
      - name: Summary
        run: python benchmarks/math500.py --summary results/*/results.jsonl
