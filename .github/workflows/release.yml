name: Release

# Publishing a GitHub release (tag v0.4.0 for version 0.4.0) builds the package,
# runs the tests and uploads it to PyPI. PyPI trusts this workflow directly
# (trusted publishing), so no token is stored in the repository.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches the version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$TAG" != "v$version" ]; then
            echo "The release tag $TAG does not match version $version in pyproject.toml."
            exit 1
          fi
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt build
      - name: Test
        run: python -m unittest discover -s tests
      - name: Build
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/automated-data-analyst
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
