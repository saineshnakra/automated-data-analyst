# Tabular Kaggle competitions ADA's modelling mode is scored on. Each one is split inside itself:
# holdout.py holds out training rows the way the test rows differ from them and scores ADA's
# predictions for them, and every competition may be used to find and fix problems. "metric" is
# the competition's own; the bar is the leaderboard score at the top 10% (the 90th percentile
# when higher is better, the 10th when lower is). Kaggle names the metric of S5E9 and S5E10
# "Mean Squared Error", but their leaderboards hold its root.
competitions:
  - {slug: titanic, metric: accuracy}
  - {slug: house-prices-advanced-regression-techniques, metric: rmsle}
  - {slug: spaceship-titanic, metric: accuracy}
  - {slug: playground-series-s6e7, metric: balanced_accuracy}
  - {slug: playground-series-s6e8, metric: auc}
  - {slug: playground-series-s6e9, metric: auc}
  - {slug: home-data-for-ml-course, metric: mae}
  - {slug: store-sales-time-series-forecasting, metric: rmsle}
  - {slug: stocks-challenge, metric: spearman, public_share: 0.18}
  - {slug: playground-series-s5e10, metric: rmse}
  - {slug: playground-series-s5e11, metric: auc}
  - {slug: playground-series-s5e12, metric: auc}
  - {slug: playground-series-s6e1, metric: rmse}
  - {slug: playground-series-s6e2, metric: auc}
  - {slug: playground-series-s6e3, metric: auc}
  - {slug: playground-series-s6e10, metric: auc}
  - {slug: playground-series-s6e4, metric: balanced_accuracy}
  - {slug: playground-series-s6e5, metric: auc}
  - {slug: playground-series-s6e6, metric: balanced_accuracy}
  - {slug: playground-series-s5e7, metric: accuracy}
  - {slug: playground-series-s5e8, metric: auc}
  - {slug: playground-series-s5e9, metric: rmse}
